name: Automated Release Distribution

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build Release Artifacts
        run: mvn -B -Pnative package

      - name: Rename Native Binary (Unix)
        if: runner.os != 'Windows'
        run: mv target/check_mbean target/check_mbean-${{ runner.os }}-${{ runner.arch }}

      - name: Rename Native Binary (Windows)
        if: runner.os == 'Windows'
        run: move target\check_mbean.exe target\check_mbean-Windows-${{ runner.arch }}.exe

      - name: Create Release (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/*.jar
            target/check_mbean-Linux-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Release (Other OS)
        if: matrix.os != 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/check_mbean-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
