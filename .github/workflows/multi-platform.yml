name: Multi-Platform Artifact Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build Native Image
        run: mvn -B -Pnative package

      - name: Rename Native Binary (Unix)
        if: runner.os != 'Windows'
        run: mv target/check_mbean target/check_mbean-${{ runner.os }}-${{ runner.arch }}

      - name: Rename Native Binary (Windows)
        if: runner.os == 'Windows'
        run: move target\check_mbean.exe target\check_mbean-Windows-${{ runner.arch }}.exe

      - name: Upload Native Binary
        uses: actions/upload-artifact@v4
        with:
          name: check_mbean-${{ matrix.os }}
          path: |
            target/check_mbean-*
